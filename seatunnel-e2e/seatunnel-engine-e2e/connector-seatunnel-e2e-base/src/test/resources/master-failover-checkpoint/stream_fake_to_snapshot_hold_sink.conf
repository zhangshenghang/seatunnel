# Job of MasterFailoverCheckpointInFlightIT: a single STREAMING pipeline whose sink writer parks
# inside snapshotState once the test arms the gate. 100 one-second FakeSource splits keep the
# pipeline alive for far longer than the test, so the checkpoint under test is the second one; the
# first checkpoint must have completed before the gate is armed to give the pipeline a real
# checkpoint sequence.
env {
  job.mode = "STREAMING"
  parallelism = 1
  checkpoint.interval = 1000
  checkpoint.timeout = 300000
  job.retry.times = 3
  job.retry.interval.seconds = 1
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100000
    split.num = 100
    split.read-interval = 100
    schema = {
      fields {
        id = "int"
        name = "string"
      }
    }
  }
}

sink {
  MasterFailoverCheckpointHold {
    plugin_input = "fake"
    hold_key = "master-failover-checkpoint-in-flight"
  }
}
