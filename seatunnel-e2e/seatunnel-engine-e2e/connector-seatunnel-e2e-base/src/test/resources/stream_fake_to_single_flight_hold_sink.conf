######
###### Continuous streaming job with a short checkpoint interval whose sink parks inside the
###### first checkpoint snapshot. The interval is several times shorter than the hold, so the
###### coordinator has to skip and re-arm several periodic triggers while one checkpoint is in
###### flight. Used by CheckpointSingleFlightIT.
######

env {
  job.mode = STREAMING
  parallelism = 1
  # Short enough that a 3.5s hold crosses several trigger periods.
  checkpoint.interval = 500
  # Deliberately much larger than the hold: the held checkpoint must not expire, it must complete
  # once the test releases the gate.
  checkpoint.timeout = 30000
  # Any coordinator error would be terminal, so a spurious checkpoint failure is visible as a
  # failed job instead of an automatic restore that could mask it.
  job.retry.times = 0
  job.retry.interval.seconds = 1
}

source {
  FakeSource {
    row.num = 1000000
    split.num = 1
    split.read-interval = 50
    schema = {
      fields {
        c_int = int
      }
    }
  }
}

sink {
  CheckpointSingleFlightTest {
  }
}
