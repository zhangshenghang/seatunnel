######
###### Batch job used by CloseFailureTerminalStateIT. The sink accepts every row and only
###### fails in its terminal close() handshake, so the failure lands after all data was written.
###### job.retry.times = 0 pins "one deployment only": a terminal close failure must fail the job
###### instead of silently restarting it (or reporting FINISHED).
######

env {
  job.mode = "BATCH"
  parallelism = 1
  job.retry.times = 0
}

source {
  FakeSource {
    plugin_output = "fake"
    parallelism = 1
    row.num = 50
    split.num = 1
    schema = {
      fields {
        c_int = int
      }
    }
  }
}

sink {
  CloseFailingTest {
    plugin_input = "fake"
  }
}
