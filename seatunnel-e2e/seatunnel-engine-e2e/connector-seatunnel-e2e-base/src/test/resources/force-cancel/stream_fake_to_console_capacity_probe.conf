######
###### Capacity probe used by ForceCancelUnresponsiveTaskIT after the force-cancelled job. It
###### needs exactly the same two fixed slots (one chained source+sink task group plus the
###### FakeSource split-enumerator group) and is kept RUNNING by its large row.num, so it can only
###### start if the force-cancelled job returned its slots to the worker.
######

env {
  job.mode = "STREAMING"
  parallelism = 1
  checkpoint.interval = 3600000
  checkpoint.timeout = 30000
}

source {
  FakeSource {
    plugin_output = "fake"
    parallelism = 1
    row.num = 100000000
    split.num = 1
    split.read-interval = 10
    schema = {
      fields {
        c_int = int
      }
    }
  }
}

sink {
  console {
    plugin_input = "fake"
  }
}
