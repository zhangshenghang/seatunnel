######
###### Streaming job used by ForceCancelUnresponsiveTaskIT. One source partition plus its
###### chained sink form a single source+sink task group, and FakeSource contributes one
###### split-enumerator coordinator group, so with a fixed pool of two slots this job owns the
###### whole worker. The checkpoint interval is pushed far out so no checkpoint barrier can reach
###### the deliberately parked sink writer during the test window.
######

env {
  job.mode = "STREAMING"
  parallelism = 1
  checkpoint.interval = 3600000
  checkpoint.timeout = 30000
}

source {
  FakeSource {
    plugin_output = "fake"
    parallelism = 1
    row.num = 100000000
    split.num = 1
    split.read-interval = 10
    schema = {
      fields {
        c_int = int
      }
    }
  }
}

sink {
  ForceCancelBlockingTest {
    plugin_input = "fake"
  }
}
