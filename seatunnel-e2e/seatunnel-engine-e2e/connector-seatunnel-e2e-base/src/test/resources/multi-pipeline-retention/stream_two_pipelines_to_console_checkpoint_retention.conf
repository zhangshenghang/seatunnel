# Job fixture for MultiPipelineCheckpointRetentionIT. One STREAMING job with two
# independent source -> sink chains, so the engine builds two pipelines that
# checkpoint concurrently under the same job id. Both sources are unbounded in
# practice (split.read-interval keeps emitting), so the periodic scheduler keeps
# producing checkpoints on both pipelines until the test fences them for a stable
# observation.
#
# The 500 ms interval makes a retention rotation happen within a few seconds; the
# Console sinks discard rows so the only engine behaviour under test is the
# per-pipeline checkpoint id sequence, storage retention and its cleanup.
env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 500
  checkpoint.timeout = 30000
  job.retry.times = 0
}

source {
  FakeSource {
    plugin_output = "fake_a"
    row.num = 1000000
    split.num = 10
    split.read-interval = 100
    schema = {
      table = "multi_pipeline_retention.fake_a"
      fields {
        id = "bigint"
        name = "string"
      }
    }
  }

  FakeSource {
    plugin_output = "fake_b"
    row.num = 1000000
    split.num = 10
    split.read-interval = 100
    schema = {
      table = "multi_pipeline_retention.fake_b"
      fields {
        id = "bigint"
        name = "string"
      }
    }
  }
}

sink {
  Console {
    plugin_input = "fake_a"
    log.print.data = false
  }

  Console {
    plugin_input = "fake_b"
    log.print.data = false
  }
}
