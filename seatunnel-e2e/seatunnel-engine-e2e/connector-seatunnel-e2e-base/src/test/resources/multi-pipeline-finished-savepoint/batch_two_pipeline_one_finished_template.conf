######
###### Template used by MultiPipelineSavepointFinishedPipelineIT. The dynamic_* placeholders are
###### replaced before the job is submitted.
######
###### Two independent BATCH pipelines with a deliberately asymmetric lifetime: "fast_source"
###### finishes right away, while "held_source" emits every row and then waits for the test on
###### SavepointPipelineHoldGate before it signals the end of its input. The held pipeline therefore
###### stays RUNNING for exactly as long as the test needs, and only the explicit release of the gate
###### lets the restored pipeline finish. The fixture is only a test bed: the contract under test is
###### what a stop-with-savepoint does while one pipeline has already FINISHED and a sibling pipeline
###### is still RUNNING.
######

env {
  job.mode = "BATCH"
  parallelism = 1
  checkpoint.interval = 1000
}

source {
  FakeSource {
    plugin_output = "fast_source"
    row.num = 10
    split.num = 1
    schema = {
      fields {
        id = "int"
        name = "string"
      }
    }
  }

  SavepointPipelineHoldTest {
    plugin_output = "held_source"
    hold_key = "${dynamic_hold_key}"
    row.num = 10
    split.num = 1
    records_per_poll = 10
  }
}

sink {
  # Writes the rows of the pipeline that finishes first to files, so the test can count them and
  # prove that a restore does not run that pipeline again. The hold key is never armed, so this sink
  # never parks.
  FinalCheckpointCloseHoldTest {
    plugin_input = "fast_source"
    hold_key = "${dynamic_unused_hold_key}"
    output_path = "${dynamic_output_path}"
  }

  Console {
    plugin_input = "held_source"
  }
}
